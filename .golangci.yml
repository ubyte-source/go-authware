version: "2"

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - testableexamples
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - testifylint
    - tparallel
    - usetesting
    - sloglint
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      # Fields keep the order of their role: no reorder shrinks a production struct, and
      # the pointer-first order would only shorten what the garbage collector scans.
      disable:
        - fieldalignment
    staticcheck:
      checks: ["all"]
    revive:
      enable-all-rules: true
      rules:
        # Code counts with 0, 1 and 2, a string read up to three times stays where it is
        # read, and the literals of a test are its data.
        - name: add-constant
          exclude: ["TEST"]
          arguments:
            - allowInts: "0,1,2"
              maxLitCount: "3"
        # A switch lists the cases it acts on; exhaustive checks every enum switch.
        - name: enforce-switch-style
          arguments: ["allowNoDefault"]
        # Examples print, and a strings.Builder write never fails.
        - name: unhandled-error
          arguments:
            - "^fmt\\.Println$"
            - "^strings\\.Builder\\.Write(Byte|Rune|String)?$"
        # One measure, one limit: the thresholds of gocognit, funlen and lll.
        - name: cognitive-complexity
          arguments: [20]
        - name: function-length
          arguments: [40, 60]
        - name: line-length-limit
          arguments: [120]
    # A naked return is reported in a function of any length.
    nakedret:
      max-func-lines: 0
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 2
      # The literals of a test are its data.
      ignore-tests: true
    gocritic:
      enabled-tags:
        - performance
        - experimental
        - opinionated
    misspell:
      locale: US
    prealloc:
      for-loops: true
    nolintlint:
      require-explanation: true
      require-specific: true
    perfsprint:
      err-error: true
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/stretchr/testify
              desc: tests assert with the standard library
        # Production code parses JSON through go-jsonfast and stays memory safe.
        production:
          files:
            - "!$test"
          deny:
            - pkg: encoding/json
              desc: JSON goes through go-jsonfast
            - pkg: unsafe
              desc: production code stays memory safe
    # A default is the branch for every other value, as Go's return rules want it.
    exhaustive:
      default-signifies-exhaustive: true
    gomodguard_v2:
      # go-jsonfast is the one dependency.
      allowed:
        - module: github.com/ubyte-source/go-jsonfast
      blocked:
        - module: github.com/stretchr/testify
          match-type: prefix
          reason: tests assert with the standard library only
        - module: gotest.tools
          match-type: prefix
          reason: tests assert with the standard library only
        - module: github.com/onsi/gomega
          reason: tests assert with the standard library only
        - module: github.com/onsi/ginkgo
          match-type: prefix
          reason: tests assert with the standard library only
        - module: github.com/matryer/is
          reason: tests assert with the standard library only
    sloglint:
      no-global: all
      context: scope
      attr-only: true
      key-naming-case: snake
      forbidden-keys:
        - err
    # The internal packages return errors that carry their context or the sentinel the
    # caller passes, and a decorator returns its delegate's errors as they are.
    wrapcheck:
      ignore-package-globs:
        - github.com/ubyte-source/go-authware/v2/internal/*
      extra-ignore-sigs:
        - func (net/http.RoundTripper).RoundTrip(
        - func (log/slog.Handler).Handle(
        - func (github.com/ubyte-source/go-authware/v2/cred.TokenSource).Token(

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ubyte-source/go-authware

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
