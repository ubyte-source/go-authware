name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned tools need Go 1.26 or later, golangci-lint the Go 1.27.1 the
      # Makefile pins; go.mod keeps 1.25.1, the oldest Go the library supports.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"

      - name: Run go vet, golangci-lint and deadcode, and the repository checks
        run: make vet lint deadcode
